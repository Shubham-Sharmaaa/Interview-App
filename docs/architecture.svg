<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <title>Architecture: React SPA on Vercel talks to a FastAPI backend on Render, which reads/writes MongoDB Atlas and calls the Gemini API</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4a5957" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="380" fill="#eef1ec"/>

  <!-- React SPA -->
  <rect x="220" y="40" width="240" height="56" rx="6" fill="#ffffff" stroke="#c7cfc7"/>
  <text x="340" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1c2b2a">React SPA · Vercel</text>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="#4a5957">Chat UI, config forms, history</text>

  <line x1="340" y1="96" x2="340" y2="150" stroke="#4a5957" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="127" font-size="11" fill="#4a5957">JWT bearer token</text>

  <!-- FastAPI backend -->
  <rect x="220" y="150" width="240" height="56" rx="6" fill="#2b6b52"/>
  <text x="340" y="173" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">FastAPI · Render</text>
  <text x="340" y="192" text-anchor="middle" font-size="12" fill="#dfeee7">Auth, answer/retry state machine</text>

  <path d="M340 206 L340 240 L185 240 L185 270" fill="none" stroke="#4a5957" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#4a5957">PyMongo async</text>

  <path d="M340 206 L340 240 L485 240 L485 270" fill="none" stroke="#4a5957" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="232" text-anchor="middle" font-size="11" fill="#4a5957">google-genai SDK</text>

  <!-- MongoDB Atlas -->
  <rect x="90" y="270" width="190" height="56" rx="6" fill="#ffffff" stroke="#c7cfc7"/>
  <text x="185" y="293" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2b2a">MongoDB Atlas</text>
  <text x="185" y="312" text-anchor="middle" font-size="12" fill="#4a5957">Users &amp; interviews</text>

  <!-- Gemini API -->
  <rect x="390" y="270" width="190" height="56" rx="6" fill="#ffffff" stroke="#b8922e"/>
  <text x="485" y="293" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2b2a">Gemini API</text>
  <text x="485" y="312" text-anchor="middle" font-size="12" fill="#4a5957">Questions &amp; feedback</text>
</svg>
